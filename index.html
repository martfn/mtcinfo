<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>MTC – 2.º Ano</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --purple:        #a855f7;
      --purple-bright: #d8b4fe;
      --green:         #22c55e;
      --green-bright:  #86efac;
      --bg-dark:       #0b0b12;
      --card-bg:       rgba(15, 15, 26, 0.65);
      --text-main:     #f8f8fb;
      --text-muted:    #94a3b8;
      --font-main:     system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background: radial-gradient(circle at 10% 0%, #2e1a47 0%, var(--bg-dark) 45%, #050508 100%);
      color: var(--text-main);
      line-height: 1.6;
      padding: 32px 16px 56px;
      min-height: 100vh;
    }

    .page { max-width: 900px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #a855f7, #22c55e);
      color: #000;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2);
    }

    .tag span { width: 6px; height: 6px; border-radius: 999px; background: #000; }

    h1 { font-size: 30px; letter-spacing: 0.03em; text-transform: uppercase; margin-top: 12px;}
    .subtitle { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

    /* ── Main Navigation Tabs ── */
    .front-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
    }

    .front-tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      font-family: var(--font-main);
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.03em;
    }

    .front-tab-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .front-tab-btn.active {
      background: rgba(168, 85, 247, 0.15);
      color: var(--purple-bright);
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.15);
    }

    .view-panel { display: none; }
    .view-panel.active { display: block; animation: fadeIn 0.3s ease; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Layout Grids ── */
    .top-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: flex-start; }
    .stack { display: flex; flex-direction: column; gap: 20px; }

    @media (max-width: 768px) {
      header { flex-direction: column; align-items: flex-start; }
      .top-grid { grid-template-columns: minmax(0, 1fr); }
      .grid { grid-template-columns: minmax(0, 1fr); }
    }

    /* ── Cards ── */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(168, 85, 247, 0.12);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    
    .card:hover { border-color: rgba(168, 85, 247, 0.3); transform: translateY(-2px); }

    .card-header {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 14px; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .card-title {
      font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      display: flex; align-items: center; gap: 10px; color: var(--purple-bright);
    }

    .card-title-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--green); box-shadow: 0 0 12px rgba(34, 197, 94, 0.9); }
    .card-meta { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }

    /* ── Event Lists ── */
    ul { list-style: none; font-size: 14px; color: var(--text-main); }
    li.event-item { padding-left: 20px; position: relative; margin-bottom: 16px; line-height: 1.5; }
    li.event-item::before {
      content: ""; position: absolute; left: 0; top: 8px; width: 6px; height: 6px;
      border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
    }
    li.event-item:last-child { margin-bottom: 0; }
    
    .event-main { display: block; }
    .event-note { display: block; font-size: 13px; color: var(--text-muted); margin-top: 4px; padding-left: 14px; border-left: 2px solid rgba(168, 85, 247, 0.35); font-style: italic; }

    .date { color: var(--green-bright); font-weight: 700; }
    .percentage { color: var(--purple-bright); font-weight: 600; font-size: 13px; }
    .emphasis { color: #fff; font-weight: 600; }
    .muted { color: var(--text-muted); font-size: 13px; }
    .highlight { color: var(--green-bright); font-weight: 700; text-transform: uppercase; font-size: 13px; }

    .note { font-size: 13px; color: var(--text-muted); margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.05); font-style: italic; }

    .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin: 20px 0 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .section-label::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.06); }

    .timeline { display: grid; gap: 4px; font-size: 14px; }
    .timeline-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
    .timeline-row:last-child { border-bottom: none; }
    .timeline-label { color: var(--text-muted); font-weight: 500; }
    .timeline-value { text-align: right; color: var(--text-main); font-weight: 600; }
    .pending { color: var(--text-muted); font-style: italic; font-size: 14px; }

    /* ── Resumos Grid ── */
    .resumos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .resumo-card { 
      background: rgba(15, 15, 26, 0.8); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px; 
      padding: 20px; transition: all 0.2s ease; display: flex; flex-direction: column; gap: 8px; text-decoration: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); backdrop-filter: blur(12px);
    }
    .resumo-card:hover { transform: translateY(-4px); border-color: rgba(34, 197, 94, 0.5); box-shadow: 0 12px 32px rgba(34, 197, 94, 0.15); }
    .resumo-title { color: var(--text-main); font-weight: 700; font-size: 16px; line-height: 1.4; }
    .resumo-author { color: var(--green-bright); font-size: 13px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="page">

    <header>
      <div>
        <div class="tag"><span></span>MTC - UA</div>
        <h1>2º Ano - Informações</h1>
      </div>
      <div class="subtitle">
        Atualizado regularmente porque gosto muito dos meus colegas de curso 🥰🥰🥰🥰<br>
        Site feito com IA. Não digam ao isaac
      </div>
    </header>

    <div class="front-tabs">
      <button class="front-tab-btn active" onclick="switchFrontTab('datas', this)">Datas</button>
      <button class="front-tab-btn" onclick="switchFrontTab('resumos', this)">Resumos</button>
    </div>

    <!-- VIEW: DATAS -->
    <div id="view-datas" class="view-panel active">
      <div class="top-grid">
        <section class="card">
          <div class="card-header">
            <div class="card-title"><div class="card-title-dot"></div>Informações Gerais</div>
          </div>
          <div class="timeline" id="timeline-gerais">
            <div style="color:var(--text-muted);font-size:13px;font-style:italic;">A carregar...</div>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <div class="card-title"><div class="card-title-dot"></div>Próximas 2 semanas</div>
            <div class="card-meta">Automático</div>
          </div>
          <ul id="upcoming-list"></ul>
          <p class="note" id="upcoming-note">
            Lista atualizada automaticamente com base na data de hoje.
          </p>
        </section>
      </div>

      <div class="grid">
        <div class="stack" id="col-left"></div>
        <div class="stack" id="col-right"></div>
      </div>
    </div>

    <!-- VIEW: RESUMOS -->
    <div id="view-resumos" class="view-panel">
      <div class="resumos-grid" id="resumos-container">
        <!-- Rendered by JS -->
      </div>
    </div>

  </div>

  <script>
    function switchFrontTab(id, btn) {
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.front-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + id).classList.add('active');
      btn.classList.add('active');
    }

    function formatPtDate(dateObj) {
      const d = String(dateObj.getDate()).padStart(2, "0");
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      return `${d}/${m}`;
    }

    function renderDateLabel(e) {
      if (e.porMarcar) return `<span class="highlight">Por marcar</span>`;
      const prefix = e.unconfirmed ? "~" : "";
      const d      = new Date(e.date + "T00:00:00");
      const time   = e.time ? `, ${e.time}` : "";
      const cls    = e.unconfirmed ? "highlight" : "date";
      return `<span class="${cls}">${prefix}${formatPtDate(d)}${time}</span>`;
    }

    function renderEventLi(e) {
      const pct       = e.pct  ? ` <span class="percentage">(${e.pct}%)</span>` : "";
      const type      = e.type ? ` <span class="muted">· ${e.type}</span>`      : "";
      const labelHtml = e.link
        ? `<a href="${e.link}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.3); transition: color 0.2s;" onmouseover="this.style.color='var(--green-bright)'" onmouseout="this.style.color='inherit'">${e.label}</a>`
        : e.label;
      const noteHtml  = e.note ? `<div class="event-note">${e.note}</div>` : "";
        
      return `<li class="event-item"><div class="event-main">${renderDateLabel(e)} – ${labelHtml}${pct}${type}</div>${noteHtml}</li>`;
    }

    // ── Informações Gerais ───────────────────────────────────────
    function buildInfoGerais(entries) {
      const el = document.getElementById("timeline-gerais");
      if (!entries.length) {
        el.innerHTML = `<div style="color:var(--text-muted);font-size:13px;font-style:italic;">Sem informações gerais.</div>`;
        return;
      }
      el.innerHTML = entries.map(e => {
        const valueHtml = e.link
          ? `<a href="${e.link}" target="_blank" rel="noopener" style="color:var(--green-bright);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(134,239,172,0.4);">${e.value}</a>`
          : e.value;
        return `
          <div class="timeline-row">
            <div class="timeline-label">${e.label}</div>
            <div class="timeline-value">${valueHtml}</div>
          </div>`;
      }).join("");
    }

    // ── Resumos View ─────────────────────────────────────────────
    function buildResumos(entries) {
      const container = document.getElementById("resumos-container");
      if (!entries.length) {
        container.innerHTML = `<div class="pending">Sem resumos adicionados ainda.</div>`;
        return;
      }
      container.innerHTML = entries.map(e => `
        <a href="${e.link}" target="_blank" rel="noopener" class="resumo-card">
          <div class="resumo-title">${e.label}</div>
          ${e.author ? `<div class="resumo-author">por ${e.author}</div>` : ''}
        </a>
      `).join('');
    }

    // ── Subject cards ────────────────────────────────────────────
    function buildSubjectCards(events) {
      const colLeft  = document.getElementById("col-left");
      const colRight = document.getElementById("col-right");

      const uniqueSubjs = [...new Set(events.map(e => e.subject).filter(s => s && s !== "Geral"))];

      colLeft.innerHTML = "";
      colRight.innerHTML = "";

      uniqueSubjs.forEach((subjId, index) => {
        const all     = events.filter(e => e.subject === subjId);
        const normal  = all.filter(e => !e.section);
        const recurso = all.filter(e => e.section === "Recurso");

        let inner = "";
        if (normal.length === 0 && recurso.length === 0) {
          inner = `<p class="pending">(Por enquanto, sem info)</p>`;
        } else {
          if (normal.length)  inner += `<ul>${normal.map(renderEventLi).join("")}</ul>`;
          if (recurso.length) inner += `<div class="section-label">Recurso</div><ul>${recurso.map(renderEventLi).join("")}</ul>`;
        }

        const card = document.createElement("section");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <div class="card-title"><div class="card-title-dot"></div>${subjId}</div>
          </div>${inner}`;
          
        (index % 2 === 0 ? colLeft : colRight).appendChild(card);
      });
    }

    // ── Upcoming list ────────────────────────────────────────────
    function buildUpcoming(events) {
      const listEl = document.getElementById("upcoming-list");
      const noteEl = document.getElementById("upcoming-note");
      if (!listEl) return;

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const inTwoWeeks = new Date(today);
      inTwoWeeks.setDate(inTwoWeeks.getDate() + 14);

      const upcoming = events
        .filter(e => !e.porMarcar && !e.recursoOnly && e.date && e.display !== "info")
        .map(e => ({ ...e, d: new Date(e.date + "T00:00:00") }))
        .filter(e => e.d >= today && e.d <= inTwoWeeks)
        .sort((a, b) => a.d - b.d);

      listEl.innerHTML = "";

      if (upcoming.length === 0) {
        const li = document.createElement("li");
        li.textContent = "Nada marcado nos próximos 14 dias. Aproveita para descansar e pagar um café aos teus representantes de curso favoritos.";
        li.style.color     = "var(--text-muted)";
        li.style.fontStyle = "italic";
        li.style.paddingLeft = "0";
        li.style.listStyle = "none";
        listEl.appendChild(li);
        if (noteEl) noteEl.style.display = "none";
        return;
      }

      upcoming.forEach(e => {
        const li           = document.createElement("li");
        li.className       = "event-item";
        
        // Main Date + Subject container
        const mainDiv      = document.createElement("div");
        mainDiv.className  = "event-main";
        
        const spanDate     = document.createElement("span");
        spanDate.className = "date";
        const prefix       = e.unconfirmed ? "~" : "";
        const time         = e.time ? `, ${e.time}` : "";
        spanDate.textContent = prefix + formatPtDate(e.d) + time;
        mainDiv.appendChild(spanDate);
        
        const subj = e.subject !== "Geral" ? ` ${e.subject} –` : "";
        if (e.link) {
          mainDiv.insertAdjacentText("beforeend", subj + " ");
          const a = document.createElement("a");
          a.href          = e.link;
          a.target        = "_blank";
          a.rel           = "noopener";
          a.textContent   = e.label;
          a.style.cssText = "color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.3); transition: color 0.2s;";
          a.onmouseover   = function() { this.style.color = 'var(--green-bright)' };
          a.onmouseout    = function() { this.style.color = 'inherit' };
          mainDiv.appendChild(a);
        } else {
          mainDiv.insertAdjacentText("beforeend", `${subj} ${e.label}`);
        }
        li.appendChild(mainDiv);
        
        // Note container
        if (e.note) {
          const noteDiv     = document.createElement("div");
          noteDiv.className = "event-note";
          noteDiv.textContent = e.note;
          li.appendChild(noteDiv);
        }
        
        listEl.appendChild(li);
      });
    }

    // ── Init ─────────────────────────────────────────────────────
    async function init() {
      let events = [];
      try {
        const res = await fetch("events.json");
        if (!res.ok) throw new Error();
        events = await res.json();
      } catch {
        console.warn("events.json não encontrado.");
      }

      // Filter sets
      const infoEntries   = events.filter(e => e.display === "info");
      const resumoEntries = events.filter(e => e.display === "resumo");
      const restEvents    = events.filter(e => e.display !== "info" && e.display !== "resumo");

      buildInfoGerais(infoEntries);
      buildResumos(resumoEntries);
      buildSubjectCards(restEvents);
      buildUpcoming(restEvents);
    }

    init();
  </script>
</body>
</html>
